name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  verify:
    name: Build & Lint
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ensure LLVM tools (clang-format & clang-tidy) are in PATH
        shell: pwsh
        run: |
          $llvmPaths = @(
            "C:\Program Files\LLVM\bin",
            "$env:VCToolsInstallDir\..\..\Llvm\x64\bin"
          )
          foreach ($p in $llvmPaths) {
            if (Test-Path (Join-Path $p "clang-tidy.exe")) {
              $resolved = (Resolve-Path $p).Path
              echo $resolved | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "Using LLVM from: $resolved"
              exit 0
            }
          }
          choco install llvm --no-progress -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify formatting (clang-format)
        shell: pwsh
        run: |
          clang-format --version
          clang-format --dry-run --Werror src/main.cpp

      - name: Configure CMake
        shell: pwsh
        run: cmake --preset default

      - name: Build Debug
        shell: pwsh
        run: cmake --build --preset debug

      - name: Build Release
        shell: pwsh
        run: cmake --build --preset release

      - name: Run static analysis (clang-tidy)
        shell: pwsh
        run: |
          clang-tidy --version
          clang-tidy -p build --warnings-as-errors=* src/main.cpp
